<!-- app.component.html -->
<div class="app-container">
  <!-- Sidebar -->
  <aside *ngIf="!isLoginPage()" class="sidebar" [class.collapsed]="isSidebarCollapsed">
    <div class="sidebar-header">
      <div class="logo">
        <i class="fas fa-building"></i>
        <span *ngIf="!isSidebarCollapsed">SIGA RemoteFlow</span>
      </div>
      <button class="toggle-btn" (click)="toggleSidebar()">
        <i class="fas fa-bars"></i>
      </button>
    </div>

    <nav class="sidebar-nav">
      <a (click)="navigateTo('/dashboard')"  class="nav-item">
        <i class="fas fa-tachometer-alt"></i>
        <span *ngIf="!isSidebarCollapsed">Dashboard</span>
      </a>
      
      <!-- Mes demandes -->
      <a *ngIf="!isAdmin()" (click)="navigateTo('/mes-demandes')"  class="nav-item">
        <i class="fas fa-tasks"></i>
        <span *ngIf="!isSidebarCollapsed">Mes demandes</span>
      </a>

      <!-- TOUTES LES DEMANDES - Pour Chef, RH et Admin uniquement -->
  <a *ngIf="isChef() || isRH() || isAdmin()" (click)="navigateTo('/toutes-demandes')" class="nav-item">
    <i class="fas fa-list-alt"></i>
    <span *ngIf="!isSidebarCollapsed">Toutes les demandes</span>
  </a>
      
      <!-- Nouvelle demande -->
      <a *ngIf="!isAdmin()" (click)="navigateTo('/requests/new')" [class.active]="isActive('/requests/new')" class="nav-item">
        <i class="fas fa-plus-circle"></i>
        <span *ngIf="!isSidebarCollapsed">Nouvelle demande</span>
      </a>
      
      <!-- Utilisateurs - ADMIN -->
      <a *ngIf="isAdmin()" (click)="navigateTo('/users')" [class.active]="isActive('/users')" class="nav-item">
        <i class="fas fa-users"></i>
        <span *ngIf="!isSidebarCollapsed">Utilisateurs</span>
      </a>
      
      <!-- Équipes - ADMIN et CHEF -->
      <a *ngIf="isAdmin() || isChef()" (click)="navigateTo('/equipes')" [class.active]="isActive('/equipes')" class="nav-item">
        <i class="fas fa-building"></i>
        <span *ngIf="!isSidebarCollapsed">
          {{ isAdmin() ? 'Équipes' : 'Mon équipe' }}
        </span>
      </a>
      
      <!-- Demandes à valider - CHEF -->
      <a *ngIf="isChef()" (click)="navigateTo('/chef/tasks')" [class.active]="isActive('/chef/tasks')" class="nav-item">
        <i class="fas fa-clipboard-list"></i>
        <span *ngIf="!isSidebarCollapsed">Demandes à valider</span>
      </a>
      
      <!-- Statistiques - RH -->
      <a *ngIf="isRH()" (click)="navigateTo('/statistiques')" [class.active]="isActive('/statistiques')" class="nav-item">
        <i class="fas fa-chart-bar"></i>
        <span *ngIf="!isSidebarCollapsed">Statistiques RH</span>
      </a>
      
      <!-- Demandes à valider - ADMIN -->
      <a *ngIf="isAdmin()" (click)="navigateTo('/admin/tasks')" [class.active]="isActive('/admin/tasks')" class="nav-item">
        <i class="fas fa-tasks"></i>
        <span *ngIf="!isSidebarCollapsed">Demandes à valider</span>
      </a>
    </nav>

    <div class="sidebar-footer">
      <div class="user-info">
        <div class="avatar">
          <i class="fas fa-user-circle"></i>
        </div>
        <div *ngIf="!isSidebarCollapsed" class="user-details">
          <span class="user-name">{{ userName || userRole }}</span>
        </div>
      </div>
      <button class="logout-btn" (click)="logout()">
        <i class="fas fa-sign-out-alt"></i>
        <span *ngIf="!isSidebarCollapsed">Déconnexion</span>
      </button>
    </div>
  </aside>

  <!-- Main Content -->
  <main class="main-content" [class.sidebar-collapsed]="isSidebarCollapsed && !isLoginPage()">
    <router-outlet></router-outlet>
  </main>
</div>
